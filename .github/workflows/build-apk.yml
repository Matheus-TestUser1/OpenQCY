name: Build and release LDAC APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ldac-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  build:
    name: Test, build ARM64 APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore test signing key
        if: env.HAS_RELEASE_SIGNING != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: openqcy-ldac-debug-signing-v1

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure optional release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          fields = {
              "storeFile": "release.keystore",
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "storePassword": os.environ["ANDROID_STORE_PASSWORD"],
          }
          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace("=", "\\=").replace(":", "\\:").replace(" ", "\\ ")
          Path("android/key.properties").write_text("".join(f"{k}={escape(v)}\n" for k, v in fields.items()))
          PYTHON

      - name: Read app version
        id: version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          match = re.search(r"^version: ([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$", Path("pubspec.yaml").read_text(), re.M)
          if not match:
              raise SystemExit("Expected version: major.minor.patch+build in pubspec.yaml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={match[1]}\ncode={match[2]}\n")
          PYTHON

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Test native read-only protocol
        run: |
          ./android/gradlew -p protocol-tests test --no-daemon
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("protocol-tests/build/test-results/test").glob("TEST-*.xml"))
          suites = [ET.parse(path).getroot() for path in reports]
          count = sum(int(suite.attrib["tests"]) for suite in suites)
          failures = sum(int(suite.attrib["failures"]) + int(suite.attrib["errors"]) for suite in suites)
          skipped = sum(int(suite.attrib["skipped"]) for suite in suites)
          if count < 12 or failures or skipped:
              raise SystemExit(f"Protocol checks incomplete: {count} tests, {failures} failures, {skipped} skipped")
          print(f"Protocol checks passed: {count} tests")
          PYTHON

      - name: Package APK and checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/OpenQCY-LDAC-Teste-v${APP_VERSION}-arm64.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cp TESTE_LDAC.md dist/TESTE_LDAC.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenQCY-LDAC-Teste-arm64
          path: dist/
          if-no-files-found: error

      - name: Publish experimental release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ldac-v${{ steps.version.outputs.version }}-build.${{ github.run_number }}.${{ github.run_attempt }}
          name: OpenQCY LDAC Teste v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            APK ARM64 experimental com controle QCY e diagnóstico SoundPEATS/SPP somente de leitura.

            Commit: `${{ github.sha }}`
            Versão: `${{ steps.version.outputs.version }}+${{ steps.version.outputs.code }}`
            Compilação: [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            O botão Testar canal SoundPEATS (SPP) consulta serviços, versão, bateria e estado LDAC sem enviar ativação.
            O controle BLE QCY continua disponível. A transmissão LDAC real deve ser conferida no Android durante a reprodução.
            Este build não altera o firmware do fone. Pode coexistir com o OpenQCY original.
            Sem os secrets de release, utiliza uma chave de desenvolvimento mantida no cache do CI.
            Confira SHA256SUMS.txt e as instruções em TESTE_LDAC.md.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/TESTE_LDAC.md
